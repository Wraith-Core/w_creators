<!doctype html>
<!-- The direction and language are set at runtime from the library's locale key (applyLocale in App.jsx).
     This is the default for the moment before the first message, and the panel is hidden then. -->
<html lang="en" dir="ltr" style="background: transparent !important; background-color: transparent !important;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>w_creators</title>
  </head>
  <body class="wst-root wst-creators" style="background: transparent !important; background-color: transparent !important;">
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- The server's one theme (w_lib/nui/theme: tokens, the Arabic and Latin faces, the w-* parts),
         linked at run time after the app's own CSS. Not imported from src/: Vite would rewrite the URL. -->
    <link rel="stylesheet" href="https://cfx-nui-w_lib/nui/assets/wraith-theme.css" />
  </body>
</html>
